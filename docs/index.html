<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تصميم الابتسامة الرقمي</title>
<meta name="theme-color" content="#0f7b6c">
<meta name="description" content="أداة عيادة لتحليل وتصميم الابتسامة الرقمي تعمل على جهاز الطبيب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface2:#eef1ee; --ink:#1d2621; --ink2:#55615a; --line:#d9dfda;
  --accent:#0f7b6c; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b26b00; --warn-soft:#fdf0dc; --fail:#c0392b; --fail-soft:#fbe4e1; --na:#7b8580;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b211e; --surface2:#232b27; --ink:#e7ece9; --ink2:#a3ada7; --line:#323b36;
  --accent:#3fb7a4; --accent-ink:#06211c; --accent-soft:#183a34;
  --ok:#53c584; --ok-soft:#173326; --warn:#e5a54a; --warn-soft:#3a2a12; --fail:#ef7a6c; --fail-soft:#3d1d19; --na:#8d9892;
}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b211e; --surface2:#232b27; --ink:#e7ece9; --ink2:#a3ada7; --line:#323b36;
  --accent:#3fb7a4; --accent-ink:#06211c; --accent-soft:#183a34;
  --ok:#53c584; --ok-soft:#173326; --warn:#e5a54a; --warn-soft:#3a2a12; --fail:#ef7a6c; --fail-soft:#3d1d19; --na:#8d9892;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.topbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand{color:var(--accent);font-weight:700}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--ink2);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--fail);border-color:var(--fail-soft)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{min-width:44px;min-height:44px;border-radius:10px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--ink)}
label.field{display:block;margin-bottom:10px}
label.field>span{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=search],input[type=tel],select,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list a.item{display:flex;align-items:center;gap:12px;padding:12px 4px;color:var(--ink);text-decoration:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.fail{background:var(--fail-soft);color:var(--fail)} .badge.na{color:var(--na)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps a{flex:none;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);text-decoration:none;font-size:14px;white-space:nowrap}
.steps a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.steps a.done::after{content:" ✓"}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.stagewrap{position:relative;overflow:auto;border-radius:10px;background:#000;max-height:72vh;direction:ltr;touch-action:pan-x pan-y}
.stage{position:relative;width:100%;margin:0 auto}
.stage canvas,.stage img.base{display:block;width:100%;height:auto}
.stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage .maskimg{position:absolute;inset:0;width:100%;height:100%;opacity:.45;pointer-events:none;image-rendering:pixelated}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.t th{color:var(--ink2);font-weight:600;font-size:13px}
.tablewrap{overflow-x:auto}
.issue{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:14px}
.issue.ok{background:var(--ok-soft);color:var(--ok)} .issue.warn{background:var(--warn-soft);color:var(--warn)} .issue.fail{background:var(--fail-soft);color:var(--fail)} .issue.info{background:var(--surface2);color:var(--ink2)}
.thumb{width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:10px;display:block}
.empty{text-align:center;padding:28px 12px;color:var(--ink2)}
.fab{position:fixed;bottom:20px;left:20px;z-index:30;border-radius:999px;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:100;max-width:90vw;font-size:14px;box-shadow:var(--shadow)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal h2{margin-top:0;font-size:17px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center;padding:24px}
.lock .box{max-width:340px;width:100%;text-align:center}
.pointlist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.pointlist button{display:flex;gap:8px;align-items:center;text-align:start;min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.pointlist button.cur{border-color:var(--accent);background:var(--accent-soft)}
.pointlist .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.pointlist button.set .dot{background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{font-weight:600}
.disclaimer{border-inline-start:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:8px;font-size:14px}
/* presentation */
.present{position:fixed;inset:0;background:#0b0d0c;color:#fff;z-index:150;display:flex;flex-direction:column}
.present .bar{display:flex;align-items:center;gap:8px;padding:10px 14px}
.present .bar .iconbtn{color:#fff}
.present .view{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;direction:ltr}
.present .ba{position:relative;max-width:100%;max-height:100%}
.present .ba canvas{display:block;max-width:100vw;max-height:calc(100vh - 150px)}
.present .ba .after{position:absolute;inset:0;overflow:hidden}
.present .ba .after canvas{position:absolute;top:0;left:0}
.present .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-1.5px);pointer-events:none}
.present .handle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:18px}
.present .lbl{position:absolute;top:10px;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:6px;font-size:13px}
.present .note{padding:10px 14px;font-size:13px;color:#e8d6a8;text-align:center}
#print-root{display:none}
@media print{
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  @page{size:A4;margin:12mm}
}
.sheet{font-family:var(--font);color:#111;background:#fff;font-size:12px;line-height:1.5}
.sheet h1{font-size:18px;margin:0}
.sheet h2{font-size:14px;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #bbb;padding:4px 6px;text-align:start;vertical-align:top}
.sheet th{background:#f0f0f0}
.sheet .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .imgs img{width:100%;border:1px solid #ccc}
.sheet .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0f7b6c;padding-bottom:6px}
.sheet .sig{display:flex;justify-content:space-between;margin-top:24px}
.sheet .warn{border:1px solid #b26b00;background:#fff6e5;padding:6px 8px;margin-top:8px}
.st-ok{color:#1f8a4c;font-weight:600}.st-warn{color:#b26b00;font-weight:600}.st-fail{color:#c0392b;font-weight:600}.st-na{color:#888}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>/* DSD core: pure functions (no DOM). Works in browser (window.DSDCore) and Node (module.exports). */
(function (root) {
  'use strict';

  // Order left→right as seen in a frontal photo (patient's right appears on viewer's left).
  const TEETH = ['13', '12', '11', '21', '22', '23'];
  const CLASS_OF = { '13': 1, '12': 2, '11': 3, '21': 4, '22': 5, '23': 6 };
  const FLIP_CHANNELS = [0, 6, 5, 4, 3, 2, 1];
  const TOOTH_NAME = {
    '13': 'ناب أيمن', '12': 'رباعية يمنى', '11': 'ثنية يمنى',
    '21': 'ثنية يسرى', '22': 'رباعية يسرى', '23': 'ناب أيسر'
  };

  const PROPORTIONS = {
    golden: { label: 'النسبة الذهبية (62%)', p: 0.618 },
    red70: { label: 'RED ثابتة 70%', p: 0.70 },
    red75: { label: 'RED ثابتة 75%', p: 0.75 },
    red80: { label: 'RED ثابتة 80%', p: 0.80 }
  };

  // Default rules: literature-based starting values; the doctor edits them in Settings.
  const DEFAULT_RULES = [
    { id: 'central_wl', group: 'teeth', label: 'نسبة عرض الثنية إلى طولها', min: 0.75, max: 0.85, target: 0.80, unit: 'ratio', enabled: true },
    { id: 'lat_central_w', group: 'teeth', label: 'عرض الرباعية إلى الثنية (ظاهري)', tol: 0.06, unit: 'ratio', enabled: true, note: 'الهدف من النسبة المختارة في التصميم' },
    { id: 'can_lat_w', group: 'teeth', label: 'عرض الناب إلى الرباعية (ظاهري)', tol: 0.08, unit: 'ratio', enabled: true, note: 'الهدف من النسبة المختارة في التصميم' },
    { id: 'lat_central_len', group: 'teeth', label: 'طول الرباعية إلى طول الثنية', min: 0.80, max: 0.90, target: 0.85, unit: 'ratio', enabled: true },
    { id: 'can_central_len', group: 'teeth', label: 'طول الناب إلى طول الثنية', min: 0.88, max: 1.00, target: 0.95, unit: 'ratio', enabled: true },
    { id: 'sym_central', group: 'teeth', label: 'تماثل الثنيتين (فرق العرض والطول)', max: 0.05, unit: 'pct', enabled: true },
    { id: 'sym_lateral', group: 'teeth', label: 'تماثل الرباعيتين', max: 0.08, unit: 'pct', enabled: true },
    { id: 'sym_canine', group: 'teeth', label: 'تماثل النابين', max: 0.10, unit: 'pct', enabled: true },
    { id: 'central_dominance', group: 'teeth', label: 'سيادة الثنيتين (أعرض الأسنان ظاهرياً)', unit: 'bool', enabled: true },
    { id: 'central_len_mm', group: 'teeth', label: 'طول الثنية بالملم', min: 10.0, max: 11.5, target: 10.8, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'central_w_mm', group: 'teeth', label: 'عرض الثنية بالملم', min: 8.0, max: 9.5, target: 8.6, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'zenith_lateral', group: 'gingiva', label: 'لثة الرباعية أنزل من لثة الثنية', min: 0.0, max: 1.5, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'zenith_canine', group: 'gingiva', label: 'لثة الناب بمستوى لثة الثنية', min: -0.5, max: 0.5, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'zenith_sym', group: 'gingiva', label: 'تماثل مستوى لثة الثنيتين', max: 0.5, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'incisal_step', group: 'teeth', label: 'الحافة القاطعة للرباعية أقصر من الثنية', min: 0.5, max: 1.5, unit: 'mm', needs: 'calib', enabled: true },
    { id: 'midline_dev', group: 'face', label: 'انحراف خط الوسط السني عن خط الوجه', max: 2.0, unit: 'mm', needs: 'face', enabled: true },
    { id: 'commissure_cant', group: 'face', label: 'ميل خط زوايا الفم عن خط العينين', max: 2.0, unit: 'deg', needs: 'face', enabled: true },
    { id: 'incisal_cant', group: 'face', label: 'ميل مستوى الأنياب (المستوى القاطع) عن خط العينين', max: 2.0, unit: 'deg', needs: 'face', enabled: true },
    { id: 'gingival_display', group: 'face', label: 'ظهور اللثة عند الابتسامة', min: 0.0, max: 2.0, unit: 'mm', needs: 'face', enabled: true },
    { id: 'buccal_corridor', group: 'face', label: 'عرض الأسنان الظاهرة إلى عرض الابتسامة', min: 0.82, max: 0.92, unit: 'ratio', needs: 'face', enabled: true },
    { id: 'smile_arc', group: 'face', label: 'قوس الابتسامة يوازي الشفة السفلى', unit: 'class', needs: 'face', enabled: true },
    { id: 'rest_display', group: 'face', label: 'ظهور الثنية والشفاه في الراحة', min: 1.0, max: 3.0, target: 2.0, unit: 'mm', needs: 'rest', enabled: true, note: 'يقلّ مع العمر وعند الرجال عادةً؛ عدّله حسب المريض' },
    { id: 'lower_third', group: 'face', label: 'الثلث السفلي إلى الأوسط من الوجه', min: 0.90, max: 1.10, unit: 'ratio', needs: 'face', enabled: true }
  ];

  const FACE_POINTS = [
    { id: 'pupilR', label: 'بؤبؤ العين اليمنى للمريض (يسار الصورة)' },
    { id: 'pupilL', label: 'بؤبؤ العين اليسرى للمريض (يمين الصورة)' },
    { id: 'glabella', label: 'منتصف ما بين الحاجبين' },
    { id: 'subnasale', label: 'أسفل الأنف (نقطة التقاء الأنف بالشفة)' },
    { id: 'menton', label: 'أسفل الذقن' },
    { id: 'commR', label: 'زاوية الفم اليمنى للمريض' },
    { id: 'commL', label: 'زاوية الفم اليسرى للمريض' },
    { id: 'upperLip', label: 'الحد السفلي للشفة العليا عند المنتصف' },
    { id: 'zenith11', label: 'أعلى لثة الثنية 11' },
    { id: 'incisal11', label: 'الحافة القاطعة للثنية 11' },
    { id: 'midlineDental', label: 'نقطة التماس بين الثنيتين (خط الوسط السني)' },
    { id: 'cusp13', label: 'رأس الناب 13' },
    { id: 'cusp23', label: 'رأس الناب 23' },
    { id: 'lastR', label: 'آخر سن ظاهر يمين المريض' },
    { id: 'lastL', label: 'آخر سن ظاهر يسار المريض' },
    { id: 'lowerLipMid', label: 'الحد العلوي للشفة السفلى عند المنتصف' },
    { id: 'lowerLipR', label: 'الشفة السفلى تحت الناب 13' },
    { id: 'lowerLipL', label: 'الشفة السفلى تحت الناب 23' }
  ];

  const SHADES = {
    BL1: '#F7F4EE', BL2: '#F3EFE6', BL3: '#EFEADF', BL4: '#EBE5D8',
    A1: '#EEE6D4', A2: '#E9DDC4', A3: '#E2D2B5', 'A3.5': '#DCC8A7', A4: '#D2BB97',
    B1: '#F0E9D8', B2: '#EAE0C8', B3: '#E1D2B1', C1: '#E5DDCC', C2: '#DCD1BC', D2: '#E6DCCB'
  };

  // ---------- geometry helpers ----------
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const deg = (r) => r * 180 / Math.PI;
  function percentile(sorted, p) {
    if (!sorted.length) return NaN;
    const i = Math.min(sorted.length - 1, Math.max(0, Math.round((p / 100) * (sorted.length - 1))));
    return sorted[i];
  }
  function lineAngleDeg(a, b) { return deg(Math.atan2(b.y - a.y, b.x - a.x)); }
  function normAngle(a) { while (a > 90) a -= 180; while (a < -90) a += 180; return a; }

  // Least squares tilt (degrees) of the tooth row from centers [{x,y}].
  function fitTilt(centers) {
    const pts = centers.filter(Boolean);
    if (pts.length < 2) return 0;
    const mx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const my = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    let sxx = 0, sxy = 0;
    for (const p of pts) { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); }
    if (sxx < 1e-9) return 0;
    return deg(Math.atan(sxy / sxx));
  }

  // ---------- model postprocessing ----------
  // logits: Float32Array [C*S*S] (NCHW, N=1). Returns probabilities Float32Array same layout.
  function softmaxNCHW(logits, C, S) {
    const n = S * S, out = new Float32Array(C * n);
    for (let i = 0; i < n; i++) {
      let m = -Infinity;
      for (let c = 0; c < C; c++) m = Math.max(m, logits[c * n + i]);
      let s = 0;
      for (let c = 0; c < C; c++) { const e = Math.exp(logits[c * n + i] - m); out[c * n + i] = e; s += e; }
      for (let c = 0; c < C; c++) out[c * n + i] /= s;
    }
    return out;
  }
  // Average probabilities of an image and its horizontally flipped prediction (TTA).
  function mergeFlipTTA(prob, probFlipped, C, S) {
    const n = S * S, out = new Float32Array(C * n);
    for (let c = 0; c < C; c++) {
      const fc = FLIP_CHANNELS[c];
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const i = y * S + x, j = y * S + (S - 1 - x);
        out[c * n + i] = 0.5 * (prob[c * n + i] + probFlipped[fc * n + j]);
      }
    }
    return out;
  }
  function argmaxNCHW(prob, C, S) {
    const n = S * S, labels = new Uint8Array(n), conf = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let b = 0, bv = prob[i];

// Fetch a model file: bundled next to the app → saved on device → remote (then saved for offline).

// ---------- auto-crop of the intra-oral photo ----------
function rectAroundTeeth(teeth, W, H) {
  const bs = C.TEETH.map((t) => teeth[t]).filter(Boolean); if (!bs.length) return null;
  let x0 = Math.min(...bs.map((b) => b.x0)), x1 = Math.max(...bs.map((b) => b.x1)), y0 = Math.min(...bs.map((b) => b.y0)), y1 = Math.max(...bs.map((b) => b.y1));

}
// Returns {q, rect, how} with rect relative to rotatedCanvas(src, q*90).
async function autoCropIntra(src) {
  let best = null;
  for (const q of [0, 1, 2, 3]) { const cv = rotatedCanvas(src, q * 90); const r = await detectOn(cv); if (!best || r.det.score > best.r.det.score) best = { q, r, cv }; }
  if (best.r.det.presentCount >= 5 && best.r.det.orderOk) return { q: best.q, rect: rectAroundTeeth(best.r.det.teeth, best.cv.width, best.cv.height), how: 'الأسنان' };
  // full-face photo: find the mouth first, then the teeth inside it
  for (const q of [...new Set([best.q, 0, 1, 2, 3])]) {
    const cv = rotatedCanvas(src, q * 90);
    let lm = null; try { lm = await faceLandmarks(cv); } catch (e) { if (q === best.q) console.warn(e); }
    if (!lm) continue;
    const ring = OUTER_LIP.map((i) => ({ x: lm[i].x * cv.width, y: lm[i].y * cv.height }));
    let x0 = Math.min(...ring.map((p) => p.x)), x1 = Math.max(...ring.map((p) => p.x)), y0 = Math.min(...ring.map((p) => p.y)), y1 = Math.max(...ring.map((p) => p.y));
    const mx = (x1 - x0) * 0.1, my = (y1 - y0) * 0.25; x0 = Math.max(0, x0 - mx); x1 = Math.min(cv.width, x1 + mx); y0 = Math.max(0, y0 - my); y1 = Math.min(cv.height, y1 + my);
    const mouth = { x: x0 / cv.width, y: y0 / cv.height, w: (x1 - x0) / cv.width, h: (y1 - y0) / cv.height };
    const crop = cropCanvas(cv, mouth, 1600); const k = (x1 - x0) / crop.width;

      const T = {}; for (const t of C.TEETH) if (r.det.teeth[t]) { const b = r.det.teeth[t]; T[t] = { x0: x0 + b.x0 * k, x1: x0 + b.x1 * k, y0: y0 + b.y0 * k, y1: y0 + b.y1 * k }; }

let samState = null;

async function samMasks(canvas, cacheKey, pt) {

    s.inputs = await s.processor(image); s.emb = await s.model.get_image_embeddings(s.inputs); s.key = cacheKey;

function maskBox(mk, pt) {

  if (xs.length < 30) return null;

  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (a, p) => a[Math.min(a.length - 1, Math.round(p / 100 * (a.length - 1)))];
  return { box: { x0: q(xs, 1), x1: q(xs, 99) + 1, y0: q(ys, 1), y1: q(ys, 99) + 1 }, area: xs.length / (mk.w * mk.h), hit: mk.has(pi) };
}

function pickToothBox(masks, pt, prev, W) {

}

function teethRect(img, ...sets) {
  const bs = sets.flatMap((T) => T ? C.TEETH.map((t) => T[t]).filter(Boolean) : []);

  let x0 = Math.min(...bs.map((b) => b.x0)), x1 = Math.max(...bs.map((b) => b.x1)), y0 = Math.min(...bs.map((b) => b.y0)), y1 = Math.max(...bs.map((b) => b.y1));
  const mx = (x1 - x0) * 0.18, my = (y1 - y0) * 0.45;

}

  (async () => { const m = await getModelBuffer().catch(() => null); mStatus.textContent = m ? `النموذج متوفر (${m.src}، ${(m.buf.byteLength / 1048576).toFixed(1)} ميغابايت)` : 'النموذج غير محمّل — الكشف التلقائي غير متاح، والتحديد اليدوي يعمل.'; })();
  const file = h('input', { type: 'file', accept: '.onnx', class: 'hidden' });
  file.addEventListener('change', async () => {
    const f = file.files[0]; if (!f) return;
    if (f.size < 100000) { toast('الملف صغير جداً — ليس نموذج ONNX'); return; }
    await DB.put('blobs', { id: 'model', blob: f, type: 'application/octet-stream' }); ortSession = null; toast('حُفظ النموذج على الجهاز'); render();
  });
  const numSet = (k, label, step) => { const i = h('input', { type: 'number', step, value: S[k] }); i.addEventListener('change', async () => { S[k] = +i.value; ortSession = null; await saveSettings(); }); return h('label', { class: 'field' }, h('span', null, label), i); };
  const boolSet = (k, label) => { const i = h('input', { type: 'checkbox', checked: !!S[k] }); i.addEventListener('change', async () => { S[k] = i.checked; await saveSettings(); }); return h('label', { class: 'check' }, i, h('span', null, label)); };
  main.append(h('div', { class: 'card' }, h('h2', null, 'نموذج كشف الأسنان (ONNX)'), mStatus,
    h('p', { class: 'muted small' }, `حمّل ملف ${MODEL_FILE} مرة واحدة (U-Net + MobileNetV2، 7 أصناف). يلزم إنترنت أول مرة لتحميل محرك ONNX Runtime ثم يعمل بلا اتصال.`),
    h('div', { class: 'row' }, file, h('button', { class: 'btn primary', onclick: () => file.click() }, 'تحميل ملف النموذج'),
      h('button', { class: 'btn danger', onclick: async () => { await DB.del('blobs', 'model'); ortSession = null; toast('حُذف'); render(); } }, 'حذف النموذج من الجهاز')),
    h('div', { class: 'grid2', style: { marginTop: '10px' } }, numSet('modelSize', 'حجم مدخل النموذج', '32'), numSet('confMin', 'حد الثقة للتنبيه', '0.01')),
    boolSet('useTTA', 'استخدام TTA (أدق وأبطأ مرتين)'), boolSet('autoStraighten', 'تصحيح ميل الصورة تلقائياً بعد الكشف')));

  const wf = h('button', { class: 'btn sm', onclick: () => warmUp('face', wf) }, 'تحميل كاشف الوجه');
  const ws = h('button', { class: 'btn sm', onclick: () => warmUp('sam', ws) }, 'تحميل نموذج التحديد بنقرة');
  const wo = h('button', { class: 'btn sm', onclick: () => warmUp('onnx', wo) }, 'تجهيز نموذج الأسنان');
  main.append(h('div', { class: 'card' }, h('h2', null, 'أدوات مساعدة إضافية'),
    h('p', { class: 'muted small' }, 'كاشف نقاط الوجه (MediaPipe Face Landmarker، نحو 4 ميغابايت) ونموذج التحديد بنقرة (SlimSAM، عشرات الميغابايت) يُحمَّلان من الإنترنت أول مرة ثم يعملان بلا اتصال. حمّلهما الآن على شبكة الواي فاي قبل استخدامهما في العيادة.'),
    h('div', { class: 'row' }, wo, wf, ws), boolSet('autoCrop', 'قص تلقائي على الأسنان بعد رفع الصورة')));
  main.append(h('div', { class: 'card' }, h('h2', null, 'مكتبة الأسنان الطبيعية'), h('p', { class: 'muted small' }, 'صور أسنان حقيقية من حالات جميلة تُستخدم في المحاكاة بدل الرسم المولَّد. احفظ فقط بموافقة المريض.'), libraryManager()));
  // design defaults
  const dSel = (k, opts, label) => { const i = h('select', null, Object.entries(opts).map(([v, l]) => h('option', { value: v, selected: S.design[k] === v }, l))); i.addEventListener('change', async () => { S.design[k] = i.value; await saveSettings(); }); return h('label', { class: 'field' }, h('span', null, label), i); };
  main.append(h('div', { class: 'card' }, h('h2', null, 'القيم الافتراضية للحالات الجديدة'), h('div', { class: 'grid2' },
    dSel('proportion', Object.fromEntries(Object.entries(C.PROPORTIONS).map(([k, v]) => [k, v.label])), 'التناسب'), dSel('shape', SHAPES, 'الشكل'),
    dSel('shade', Object.fromEntries(Object.keys(C.SHADES).map((k) => [k, k])), 'اللون'), dSel('material', Object.fromEntries(MATERIALS.map((m) => [m, m])), 'المادة'),
    numSet('ipdMm', 'مسافة العينين الافتراضية (ملم) عند غياب معايرة', '0.5'))));

  // rules
  const rc = h('div', { class: 'card' }, h('h2', null, 'قواعد التصميم'), h('p', { class: 'muted small' }, 'قيم افتراضية من الأدبيات. عدّلها حسب معاييرك؛ تُطبّق على كل الحالات فوراً.'));
  const tb = h('tbody');
  const cell = (r, k, step) => { if (r[k] === undefined) return h('td', { class: 'muted' }, '—'); const i = h('input', { type: 'number', step, value: r[k] ?? '', style: { minWidth: '70px' } }); i.addEventListener('change', async () => { r[k] = i.value === '' ? null : +i.value; await saveSettings(); }); return h('td', null, i); };
  for (const r of S.rules) {
    const en = h('input', { type: 'checkbox', checked: r.enabled, 'aria-label': 'تفعيل' }); en.addEventListener('change', async () => { r.enabled = en.checked; await saveSettings(); });
    tb.append(h('tr', null, h('td', null, en), h('td', null, r.label, r.note ? h('div', { class: 'muted small' }, r.note) : null, h('div', { class: 'muted small' }, { ratio: 'نسبة', pct: 'نسبة فرق (0.05 = 5%)', mm: 'ملم', deg: 'درجة', bool: 'نعم/لا', class: 'تصنيف' }[r.unit] || '')), cell(r, 'min', '0.01'), cell(r, 'max', '0.01'), cell(r, 'target', '0.01'), cell(r, 'tol', '0.01')));
  }
  rc.append(h('div', { class: 'tablewrap' }, h('table', { class: 't' }, h('thead', null, h('tr', null, h('th', null, ''), h('th', null, 'القاعدة'), h('th', null, 'أدنى'), h('th', null, 'أعلى'), h('th', null, 'الهدف'), h('th', null, 'تسامح'))), tb)),
    h('div', { class: 'row', style: { marginTop: '10px' } },
      h('button', { class: 'btn', onclick: async () => { if (await confirmBox('استعادة القواعد', 'إرجاع كل القواعد إلى القيم الافتراضية؟')) { S.rules = C.clone(C.DEFAULT_RULES); await saveSettings(); render(); } } }, 'استعادة الافتراضي'),
      h('button', { class: 'btn', onclick: async () => {
        const ta = h('textarea', { style: { minHeight: '260px', direction: 'ltr', fontFamily: 'monospace', fontSize: '12px' } }, JSON.stringify(S.rules, null, 1));
        const v = await modal('القواعد (JSON)', ta, [{ label: 'إلغاء', value: null }, { label: 'حفظ', value: () => ta.value, primary: true }]);
        if (v == null) return;
        try { const arr = JSON.parse(v); if (!Array.isArray(arr) || !arr.every((r) => r.id && r.label)) throw 0; S.rules = arr; await saveSettings(); render(); } catch (e) { toast('JSON غير صالح'); }
      } }, 'تحرير/نسخ JSON')));
  main.append(rc);

  // security & backup
  const sec = h('div', { class: 'card' }, h('h2', null, 'الأمان والنسخ الاحتياطي'),
    h('p', { class: 'muted small' }, 'رمز الدخول يمنع فتح التطبيق، لكنه لا يشفّر البيانات داخل المتصفح. احمِ الجهاز نفسه بقفل شاشة. النسخة الاحتياطية مشفّرة بكلمة مرور (AES-256).'),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: async () => {
        const a = await promptBox('رمز الدخول', 'رمز جديد (4 أرقام على الأقل)، اتركه فارغاً للإلغاء', 'password'); if (a == null) return;
        if (!a) { S.pin = null; await saveSettings(); toast('أُلغي رمز الدخول'); return; }
        if (a.length < 4) { toast('الرمز قصير'); return; }
        const b = await promptBox('تأكيد الرمز', 'أعد كتابة الرمز', 'password'); if (a !== b) { toast('الرمزان غير متطابقين'); return; }
        const salt = crypto.getRandomValues(new Uint8Array(16)); S.pin = { salt: b64.enc(salt), hash: await hashPin(a, salt) }; await saveSettings(); toast('فُعّل رمز الدخول');
      } }, S.pin ? 'تغيير/إلغاء رمز الدخول' : 'تفعيل رمز الدخول'),
      h('button', { class: 'btn primary', onclick: exportBackup }, '⬇ تصدير نسخة احتياطية مشفّرة'),
      h('button', { class: 'btn', onclick: importBackup }, '⬆ استيراد نسخة'),
      h('button', { class: 'btn', onclick: async () => { const ok = await navigator.storage?.persist?.(); toast(ok ? 'فُعّل التخزين الدائم' : 'رفض المتصفح التخزين الدائم — ثبّت التطبيق على الشاشة الرئيسية وحاول مجدداً'); } }, 'طلب تخزين دائم')),
    storageCard());
  main.append(sec);
  main.append(h('div', { class: 'card muted small' }, h('h2', null, 'حول النظام'),
    h('p', null, `الإصدار ${APP_VERSION}. أداة مساعدة لتحليل وتصميم الابتسامة، وليست جهاز تشخيص. كل اقتراح يراجعه الطبيب ويعتمده.`),
    h('p', null, 'نموذج الكشف: U-Net بمشفّر MobileNetV2، دُرّب على مجموعات Roboflow مفتوحة (CC BY 4.0): Teeth-detection-FDI-System (rizka-milandga-2k04u)، tooth_frontal (gradproject-g265b)، teeth (tooth-yqbyw). Dice 0.956 على 20 صورة اختبار من نفس المصادر؛ الدقة على صور العيادة لم تُقَس بعد مقابل قياسات الفرجار.'),
    h('p', null, 'القيم الافتراضية للقواعد من أدبيات تصميم الابتسامة (نسبة عرض/طول الثنية 75–85%، النسبة الذهبية وRED، خط الوسط، ممر الشدق، قوس الابتسامة) ويُفترض أن يراجعها الطبيب.'),
    h('button', { class: 'btn', onclick: async () => { S.disclaimerAccepted = false; await showDisclaimer(); } }, 'عرض التنبيه')));
}
async function exportBackup() {
  const pw = await promptBox('كلمة مرور النسخة', 'كلمة مرور قوية (8 أحرف على الأقل). بدونها لا يمكن فتح النسخة.', 'password'); if (!pw) return;
  if (pw.length < 8) { toast('كلمة المرور قصيرة'); return; }
  const pw2 = await promptBox('تأكيد', 'أعد كتابة كلمة المرور', 'password'); if (pw !== pw2) { toast('غير متطابقة'); return; }
  toast('جارٍ التجهيز…');
  const blobs = [];
  for (const r of await DB.all('blobs')) { if (r.id === 'model') continue; blobs.push({ id: r.id, type: r.type, b64: b64.enc(await r.blob.arrayBuffer()) }); }
  const settings = { ...S, pin: null };
  const plain = new TextEncoder().encode(JSON.stringify({ patients: await DB.all('patients'), cases: await DB.all('cases'), blobs, settings, at: Date.now(), v: APP_VERSION }));
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  const file = JSON.stringify({ format: 'dsd-backup', v: 1, kdf: 'PBKDF2-SHA256', iter: 250000, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) });
  downloadBlob(new Blob([file], { type: 'application/octet-stream' }), `dsd-backup-${new Date().toISOString().slice(0, 10)}.dsdb`);
  await DB.setKV('lastBackup', Date.now()); toast('حُفظت النسخة — انقلها إلى مكان آمن خارج الجهاز');
}
async function importBackup() {
  const inp = h('input', { type: 'file', accept: '.dsdb,application/octet-stream,application/json' });
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    let j; try { j = JSON.parse(await f.text()); if (j.format !== 'dsd-backup') throw 0; } catch (e) { toast('ملف غير صالح'); return; }
    const pw = await promptBox('كلمة مرور النسخة', 'كلمة المرور', 'password'); if (!pw) return;
    let data;
    try { const key = await deriveKey(pw, b64.dec(j.salt), j.iter); data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(j.iv) }, key, b64.dec(j.data)))); }
    catch (e) { toast('كلمة مرور خاطئة أو ملف تالف'); return; }
    if (!await confirmBox('استيراد', `ستُضاف/تُحدّث ${data.patients.length} مريض و${data.cases.length} حالة. السجلات بنفس المعرّف تُستبدل. متابعة؟`, 'استيراد')) return;
    for (const p of data.patients) await DB.put('patients', p);
    for (const c of data.cases) await DB.put('cases', c);
    for (const b of data.blobs) await DB.put('blobs', { id: b.id, type: b.type, blob: new Blob([b64.dec(b.b64)], { type: b.type }) });
    if (data.settings && await confirmBox('الإعدادات', 'استيراد الإعدادات والقواعد من النسخة أيضاً؟', 'نعم')) { const pin = S.pin; S = Object.assign(S, data.settings, { pin }); await saveSettings(); }
    imageCache.clear(); toast('تم الاستيراد'); go('#/');
  });
  inp.click();
}

// ---------- init ----------
(async function init() {
  try {
    await DB.open(); await loadSettings();
  } catch (e) { document.body.innerHTML = '<p style="padding:20px">تعذّر فتح قاعدة البيانات في هذا المتصفح. جرّب Chrome حديثاً خارج وضع التصفح الخفي.</p>'; return; }
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.__NO_SW) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* ignore */ }
  await showLock();
  await render();
  showDisclaimer();
})();
