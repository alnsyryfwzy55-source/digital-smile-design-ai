name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'docs/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android project + bundled web app
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.alnusairi --project-name smile_design .
          bash tool/prepare.sh
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smile-design-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: تطبيق أندرويد ${{ github.run_number }}
          body: ثبّت app-release.apk على الجوال. يعمل دون إنترنت.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
