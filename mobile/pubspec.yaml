name: smile_design
description: "Digital Smile Design — the clinic app as an offline Android app (the web app in docs/, served on the phone)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/web/icon-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/web/icon-512.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  # filled by tool/prepare.sh from ../docs (the same files GitHub Pages serves)
  assets:
    - assets/web/
    - assets/web/annotate/
    - assets/web/vendor/
    - assets/web/vendor/mediapipe/
    - assets/web/vendor/mediapipe/wasm/
